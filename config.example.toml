logging_level = "INFO"

[paths]
database = "/var/lib/jayspray/database/firmware.db"
downloads = "/var/lib/jayspray/downloads"
extracted = "/var/lib/jayspray/extracted"
cache = "/var/lib/jayspray/cache"
state = "/var/lib/jayspray/state"

[[targets]]
model = "SM-S928U1"
csc = "XAA"
enabled = true

[[targets]]
model = "SM-A556E"
csc = "INS"
enabled = false

[discovery]
# Global newest-release indexes. SamFW is supported as an isolated placeholder but
# disabled because its live feed currently rejects ordinary HTTP requests.
sources = ["samfrew", "sammobile"]
pages_per_source = 1
history_limit_per_target = 5

[http]
timeout_seconds = 30
retries = 3
retry_base_seconds = 1.0
request_delay_seconds = 1.0
max_response_bytes = 5242880
user_agent = "JAYSPRAY/0.2.0 (+https://github.com/jaydaVis04/JAYSPRAY)"

[download]
automatic = false
automatic_extract = false
concurrency = 1
connections_per_file = 1
minimum_free_bytes = 16106127360
samloader_executable = "/usr/local/bin/samloader"
# Optional but recommended: pin the exact installed executable after verifying its release.
# samloader_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
command_timeout_seconds = 21600

[extract]
max_members = 5000
max_total_bytes = 32212254720
max_member_bytes = 12884901888
max_compression_ratio = 1000
