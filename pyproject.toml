[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "samsung-fw-sync"
version = "0.1.0"
description = "Linux-only Samsung firmware discovery, download, verification, and extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Samsung Firmware Sync contributors"}]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Archiving",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
fwtool = "fwtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fwtool = ["migration_sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["live: explicitly opt-in test requiring Samsung network access"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude", "Bifrost"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fwtool"]
